[project]
name = "corpus-to-library"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Olivia Cheng", email = "oliviacheng2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.44.0",
    "google-genai>=3.1.0",
    "orjson>=3.13.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "tqdm>=4.70.1",
]

[project.scripts]
corpus-to-library = "corpus_to_library:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
